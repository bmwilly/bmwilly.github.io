<aside
  id="lichess-ratings"
  class="lichess-ratings"
  data-username="{{ site.lichess_username }}"
  data-days="90"
  aria-live="polite"
>
  <!--
    Blitz/Rapid sparklines from _data/lichess-rating-history.json (refreshed by
    .github/workflows/lichess-ratings-snapshot.yml with a Lichess token).
    Jekyll inlines the snapshot; the browser never calls Lichess.
  -->
  <script type="application/json" id="lichess-rating-history-data">{{ site.data["lichess-rating-history"] | jsonify }}</script>
  <div class="lichess-ratings__top">
    <div class="lichess-ratings__heading">
      <a href="https://lichess.org/@/{{ site.lichess_username }}">Lichess</a>
      <span class="lichess-ratings__window">last 90 days</span>
    </div>
    <div class="lichess-ratings__mood" hidden>
      <svg class="lichess-ratings__face" viewBox="0 0 40 40" aria-hidden="true">
        <circle class="lichess-ratings__face-head" cx="20" cy="20" r="17"></circle>
        <circle class="lichess-ratings__face-eye" cx="14" cy="16" r="1.8"></circle>
        <circle class="lichess-ratings__face-eye" cx="26" cy="16" r="1.8"></circle>
        <path class="lichess-ratings__face-mouth" d="M12 26 Q20 26 28 26"></path>
      </svg>
      <span class="lichess-ratings__mood-label"></span>
    </div>
  </div>
  <p class="lichess-ratings__note">A good proxy of my mental health.</p>
  <p class="lichess-ratings__status">Loading ratings…</p>
  <div class="lichess-ratings__series" hidden></div>
  <noscript>Enable JavaScript to view Lichess ratings, or visit <a href="https://lichess.org/@/{{ site.lichess_username }}">lichess.org/@/{{ site.lichess_username }}</a>.</noscript>
</aside>
<script src="{{ '/assets/js/lichess-ratings.js' | relative_url }}" defer></script>
